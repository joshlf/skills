name: Public package checks
'on': [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  packages:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check public package structure (not behavioral quality)
        run: python3 -I -B tests/check_packages.py
