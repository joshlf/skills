name: Public package checks
'on': [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  packages:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select packaging Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Prepare packaging environment
        run: |
          python3 -m venv "$RUNNER_TEMP/package-env"
          "$RUNNER_TEMP/package-env/bin/python" -m pip install --only-binary :all: --require-hashes \
            -r tools/requirements.txt
      - name: Check public package structure (not behavioral quality)
        run: '"$RUNNER_TEMP/package-env/bin/python" -I -B tests/check_packages.py'
