[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-nav"
dynamic = ["version"]
description = "Immutable source navigation for reference report corpora"
requires-python = ">=3.11"
dependencies = ["markdown-it-py==4.0.0"]

[project.scripts]
corpus-nav = "corpus_nav.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "corpus_nav.__version__"}
