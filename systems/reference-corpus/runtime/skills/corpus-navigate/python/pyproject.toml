[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-nav"
version = "0.1.0"
description = "Immutable source navigation for reference and native Markdown corpora"
requires-python = ">=3.11"
dependencies = ["markdown-it-py==4.0.0"]

[project.scripts]
corpus-nav = "corpus_nav.cli:main"
corpus-docs = "corpus_docs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
